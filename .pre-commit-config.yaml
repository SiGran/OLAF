exclude: ^\.idea/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Golden fixtures are byte-exact copies of real instrument output and curated
      # results. Rewriting them - e.g. stripping the trailing tab that marks an empty
      # Picture column in a .dat - silently edits scientific source data, which the
      # goldens README explicitly forbids.
      - id: trailing-whitespace
        exclude: ^tests/test_data/
      - id: end-of-file-fixer
        exclude: ^tests/test_data/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^olaf/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        exclude: ^tests/
